# Tooling config only. Dependencies live in requirements.txt, so there is one source
# of truth; this file just tells ruff how this repo is written.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # import order
  "UP",  # modern syntax for the target version
  "B",   # common bugs (mutable defaults, lost exceptions, ...)
  "SIM", # simplifiable constructs
]

[tool.ruff.lint.per-file-ignores]
# Tests may import numpy/opencv lazily and use their own naming.
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
